services:
  postgres:
    image: postgres:16
    container_name: backend_pronoticos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: backend_pronoticos
      POSTGRES_USER: pronostats
      POSTGRES_PASSWORD: pronostats123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "15432:5432"
    volumes:
      - backend_pronoticos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pronostats -d backend_pronoticos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_pronoticos_data:
