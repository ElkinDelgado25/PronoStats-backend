# Dependabot: mantiene Actions y dependencias al dia.
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # GitHub Actions usadas en .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  # Dependencias Python (requirements.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      pip-production:
        patterns:
          - "*"
